[build-system]
requires = ["setuptools >= 69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monitorize"
version = "0.34"
description = "Create Sunshine-backed virtual displays for Moonlight clients"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Monitorize contributors" }]
dependencies = [
    "PyQt6; sys_platform != 'darwin'",
    "PyQt6>=6.6,<6.8; sys_platform == 'darwin'",
    "Jinja2",
    "dbus-python; sys_platform == 'linux'",
    "PyGObject; sys_platform == 'linux'",
]

[project.scripts]
monitorize = "monitorize.__main__:main"

[tool.setuptools.packages.find]
where = ["linux"]
include = ["monitorize*"]

[tool.setuptools.package-data]
monitorize = [
    "macos/native/monitorize-display",
    "macos/native/*.m",
    "assets/*",
    "assets/svg/*",
    "assets/tray/*",
    "qml/*.qml",
]
