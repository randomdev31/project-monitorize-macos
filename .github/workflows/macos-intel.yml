name: macOS Intel
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  intel:
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: bash macos/build-native.sh
      - run: python -m pip install . build
      - run: python -m unittest discover -s macos/tests -v
      - name: Build wheel containing Intel helper
        run: python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: monitorize-macos-intel-wheel
          path: dist/*.whl
