<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="io.github.vinnavannewton.MonitorizeRemoteLogin1"/>
  </policy>
  <policy context="default">
    <deny own="io.github.vinnavannewton.MonitorizeRemoteLogin1"/>
    <allow send_destination="io.github.vinnavannewton.MonitorizeRemoteLogin1"
           send_interface="io.github.vinnavannewton.MonitorizeRemoteLogin1"/>
    <allow send_destination="io.github.vinnavannewton.MonitorizeRemoteLogin1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.vinnavannewton.MonitorizeRemoteLogin1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
